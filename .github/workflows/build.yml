name: Build

# Builds release binaries on every merge to main and attaches them to the run,
# so nobody has to rebuild by hand. Signing and store upload come later
# (see the "Publish Sous" task on the Superthread day5 board).

on:
  push:
    branches: [main]
    paths:
      - apps/mobile/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/mobile

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: apps/mobile/pubspec.yaml
          cache: true
      - run: flutter test
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: sous-android-${{ github.run_number }}
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  ios:
    name: iOS release (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: apps/mobile/pubspec.yaml
          cache: true
      - run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }}
      - name: Zip Runner.app
        run: cd build/ios/iphoneos && zip -qr "$GITHUB_WORKSPACE/apps/mobile/sous-ios-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: sous-ios-unsigned-${{ github.run_number }}
          path: apps/mobile/sous-ios-unsigned.zip
          retention-days: 30
