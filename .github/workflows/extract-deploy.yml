name: Extract deploy

on:
  push:
    branches: [main]
    paths:
      - workers/extract/**
      - packages/contracts/**
      - .github/workflows/extract-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: workers/extract

concurrency:
  group: extract-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to build40for40.com/sous/api/v1/shares
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: workers/extract/.node-version
          cache: npm
          cache-dependency-path: workers/extract/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: List the Worker secrets that are set
        id: secrets
        run: |
          {
            echo "names<<EOF"
            [ -n "$ANTHROPIC_API_KEY" ] && echo ANTHROPIC_API_KEY
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/extract
          secrets: ${{ steps.secrets.outputs.names }}
          command: deploy

      - name: Skip deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Deploy skipped because the CLOUDFLARE_API_TOKEN secret isn't set."
