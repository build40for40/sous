name: Extract

on:
  pull_request:
    paths:
      - workers/extract/**
      - packages/contracts/**
      - .github/workflows/extract.yml
  push:
    branches: [main]
    paths:
      - workers/extract/**
      - packages/contracts/**
      - .github/workflows/extract.yml

permissions:
  contents: read

defaults:
  run:
    working-directory: workers/extract

concurrency:
  group: extract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: workers/extract/.node-version
          cache: npm
          cache-dependency-path: workers/extract/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
