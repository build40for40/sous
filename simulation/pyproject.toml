[project]
name = "sous-sim"
version = "0.1.0"
description = "Simulation of Sous's Instagram-to-recipe pipeline for four users"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2026.10.26",
    "faster-whisper>=1.1",
    "anthropic>=0.70",
]

[project.scripts]
sous-sim = "sous_sim.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sous_sim"]
