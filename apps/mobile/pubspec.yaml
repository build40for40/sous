name: sous
description: "Sous"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7
  flutter: 3.47.9

dependencies:
  crypto: ^3.0.8
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_web_auth_2: ^5.1.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  shaders:
    - shaders/flame.frag
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
